services:
  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${SERVICE_USER_MONGODB:-tabletop}
      MONGO_INITDB_ROOT_PASSWORD: ${SERVICE_PASSWORD_MONGODB:-tabletop_pass}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  app:
    # Published by .github/workflows/release.yml on every merge into main.
    # Override IMAGE_TAG with a version or a commit sha to pin or roll back.
    image: ${APP_IMAGE:-ghcr.io/lucasrguerra/tabletop}:${IMAGE_TAG:-latest}
    pull_policy: always
    expose:
      - "3000"
    # ports:
    #   - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://${SERVICE_USER_MONGODB:-tabletop}:${SERVICE_PASSWORD_MONGODB:-tabletop_pass}@mongodb:27017/tabletop?authSource=admin
      - NEXTAUTH_SECRET=${SERVICE_PASSWORD_64_NEXTAUTH:-default_nextauth_secret_change_me}
      - NEXTAUTH_URL=${SERVICE_URL_APP:-http://localhost:3000}
      - CSRF_SECRET=${SERVICE_PASSWORD_64_CSRF:-default_csrf_secret_change_me}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

volumes:
  mongodb_data:
