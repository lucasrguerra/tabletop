name: CI

# Runs on every feature branch and on the merge into main. Publishing lives in
# release.yml and only depends on this workflow passing.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Testes (unidade e integração)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # mongodb-memory-server downloads its own mongod binary on first use.
      - name: Vitest
        run: npm test

  e2e:
    name: Testes E2E (tema claro e escuro)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Instala o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      # `npm run test:e2e` builds first: the theme suite asserts on compiled
      # CSS, which a dev server can serve stale.
      - name: Playwright
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  security:
    name: Trivy (dependências, segredos e Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repositório
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-dirs: node_modules,.next

  image:
    name: Build da imagem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built but not pushed: this proves the Dockerfile still works on every
      # branch, while publishing stays in release.yml.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tabletop:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy na imagem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tabletop:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
